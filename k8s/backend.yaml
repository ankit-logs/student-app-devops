apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: student-app
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: dubey23/student-backend:1.0.0   # change to your Docker Hub user and tag
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom: { secretKeyRef: { name: db-credentials, key: SPRING_DATASOURCE_URL } }
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: db-credentials, key: SPRING_DATASOURCE_USERNAME } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: SPRING_DATASOURCE_PASSWORD } }
          startupProbe:                      # Spring Boot can take a while to start
            tcpSocket: { port: 8080 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:                    # /api/users also proves the database connection works
            httpGet: { path: /api/users, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
---
# ClusterIP: the backend is only reachable inside the cluster, through the frontend's /api proxy.
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: student-app
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
