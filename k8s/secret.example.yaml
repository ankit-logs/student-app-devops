# Template only. Do NOT put real passwords in this file or commit them.
#
#   cp k8s/secret.example.yaml k8s/secret.yaml      # secret.yaml is git-ignored
#   nano k8s/secret.yaml                            # set real values
#   kubectl apply -f k8s/secret.yaml
#
# Or create the secret directly without a file:
#   kubectl -n student-app create secret generic db-credentials \
#     --from-literal=SPRING_DATASOURCE_URL='jdbc:mariadb://mariadb:3306/student_db' \
#     --from-literal=SPRING_DATASOURCE_USERNAME='admin' \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='<password>' \
#     --from-literal=MARIADB_ROOT_PASSWORD='<root-password>' \
#     --from-literal=MARIADB_DATABASE='student_db' \
#     --from-literal=MARIADB_USER='admin' \
#     --from-literal=MARIADB_PASSWORD='<password>'
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: student-app
type: Opaque
stringData:
  # Used by the backend. For in-cluster MariaDB use the URL below.
  # For Amazon RDS use: jdbc:mariadb://<rds-endpoint>:3306/student_db?sslMode=trust
  SPRING_DATASOURCE_URL: "jdbc:mariadb://mariadb:3306/student_db"
  SPRING_DATASOURCE_USERNAME: "admin"
  SPRING_DATASOURCE_PASSWORD: "CHANGE_ME"
  # Used only by the in-cluster MariaDB (k8s/mariadb.yaml). Not needed for RDS.
  MARIADB_ROOT_PASSWORD: "CHANGE_ME_ROOT"
  MARIADB_DATABASE: "student_db"
  MARIADB_USER: "admin"
  MARIADB_PASSWORD: "CHANGE_ME"
